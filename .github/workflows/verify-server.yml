nname: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted  # funciona con NETWORK SERVICE

    steps:
      - name: UTF-8 output
        shell: powershell
        run: chcp 65001

      - name: Git safe directory for NetworkService
        shell: powershell
        run: |
          git config --global --add safe.directory 'C:/Apps Saltillo/mold-change-dashboard motus'

      - name: Install pnpm for NETWORK SERVICE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # 1) Forzar TLS moderno
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # 2) Mostrar node/npm
          where.exe node
          node -v
          where.exe npm
          npm -v

          # 3) Fijar prefix para instalar pnpm sin tocar Program Files
          $prefix = Join-Path $env:APPDATA 'npm'
          npm config set prefix "$prefix"
          npm config set fund false
          npm config set update-notifier false

          # 4) Instalar pnpm global para NETWORK SERVICE
          npm install -g pnpm

          # 5) Agregar la ruta global al PATH de ESTA sesión
          $env:Path = "$env:Path;$prefix"
          Write-Host ">>> Ruta npm global: $prefix"

          # 6) Validar pnpm
          where.exe pnpm
          pnpm -v

      - name: Deploy application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $targetPath = "C:\Apps Saltillo\mold-change-dashboard motus"
          Write-Host ">>> Deploy en: $targetPath"

          if (-not (Test-Path $targetPath)) {
            throw "ERROR: La carpeta no existe: $targetPath"
          }

          Set-Location $targetPath
          
          Write-Host ">>> Sincronizando código..."
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd

          Write-Host ">>> Instalando dependencias..."
          pnpm install --frozen-lockfile

          Write-Host ">>> Construyendo proyecto..."
          pnpm build

          Write-Host ">>> Reiniciando PM2..."
          pm2 restart Apps_Motus
