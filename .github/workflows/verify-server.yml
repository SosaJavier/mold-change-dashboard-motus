name: Verify & Deploy Mold Change Dashboard

on:
  push:
    branches:
      - main

jobs:
  verify-server:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Verificar servidor
        run: |
          # Aquí puedes agregar los checks que tenías en verify-server.yml
          Write-Host "Verificación del servidor completada"

  deploy:
    needs: verify-server
    runs-on: self-hosted
    steps:
      - name: Pull repo actualizado
        working-directory: "C:\\Apps Saltillo\\mold-change-dashboard motus"
        run: |
          git reset --hard
          git clean -fd
          git pull origin main

      - name: Instalar dependencias
        working-directory: "C:\\Apps Saltillo\\mold-change-dashboard motus"
        run: |
          "C:\\Users\\jramos\\AppData\\Roaming\\npm\\pnpm.cmd" install

      - name: Build proyecto
        working-directory: "C:\\Apps Saltillo\\mold-change-dashboard motus"
        run: |
          "C:\\Users\\jramos\\AppData\\Roaming\\npm\\pnpm.cmd" run build

      - name: Copiar solo archivos nuevos/modificados a carpeta web
        run: |
          $SRC = "C:\\Apps Saltillo\\mold-change-dashboard motus\\dist\\*"
          $DEST = "C:\\Apps Saltillo\\web-mold-change\\"
          robocopy $SRC $DEST /MIR /XO /LOG:C:\\Apps\Saltillo\\deploy_log.txt

      - name: Mostrar log de deploy
        run: |
          Get-Content C:\\Apps\Saltillo\\deploy_log.txt
