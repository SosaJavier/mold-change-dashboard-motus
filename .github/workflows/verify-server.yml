name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted  # Cuando vuelvas a tener label personalizado, puedes usar [self-hosted, server-motus]

    steps:
      - name: Set UTF-8 (logs claros)
        shell: powershell
        run: |
          chcp 65001 > $null
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()

      # - name: (Opcional) Git safe directory
      #   shell: powershell
      #   run: git config --global --add safe.directory 'C:/Apps Saltillo/mold-change-dashboard motus'

      - name: Habilitar corepack/pnpm (por si PATH de servicio difiere)
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v
          node -v

      - name: Deploy application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $targetPath = "C:\Apps Saltillo\mold-change-dashboard motus"
          Write-Host ">>> Iniciando despliegue en: $targetPath"
          
          if (-not (Test-Path $targetPath)) {
            Write-Error "Error: El directorio destino no existe."
            exit 1
          }

          Set-Location $targetPath

          Write-Host ">>> Sincronizando código..."
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd

          Write-Host ">>> Instalando dependencias (pnpm)..."
          pnpm install --frozen-lockfile

          Write-Host ">>> Construyendo proyecto..."
          pnpm build

          Write-Host ">>> Reiniciando PM2..."
          pm2 restart Apps_Motus
