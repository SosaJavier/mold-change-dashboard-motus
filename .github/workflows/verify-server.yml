name: Deploy Mold Change Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Stop app if exists
      - name: Stop PM2 App
        run: pm2 stop Apps_Motus
        continue-on-error: true

      # 2️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # 3️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4️⃣ Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install

      # 6️⃣ Build project
      - name: Build project
        run: pnpm run build

      # 7️⃣ Delete old process (ignore if not exists)
      - name: Delete old PM2 process
        shell: cmd
        run: pm2 delete Apps_Motus
        continue-on-error: true

      # 8️⃣ Start app correctly in Windows
      - name: Start PM2 App
        shell: cmd
        run: pm2 start pnpm --name Apps_Motus -- start
