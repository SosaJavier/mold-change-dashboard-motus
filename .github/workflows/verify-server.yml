name: Deploy Mold Change Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Deploy to web folder
        run: |
          $SRC = "$env:GITHUB_WORKSPACE\dist\*"
          $DEST = "C:\Apps Saltillo\web-mold-change\"
          robocopy $SRC $DEST /MIR
