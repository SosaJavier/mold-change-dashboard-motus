name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: UTF-8
        shell: powershell
        run: chcp 65001

      - name: Git safe directory for NetworkService
        shell: powershell
        run: |
          git config --global --add safe.directory 'C:/Apps Saltillo/mold-change-dashboard motus'

      - name: Show node/pnpm
        shell: powershell
        run: |
          where.exe node
          node -v
          where.exe pnpm
          pnpm -v

      - name: Deploy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $targetPath = "C:\Apps Saltillo\mold-change-dashboard motus"

          Set-Location $targetPath

          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd

          pnpm install --frozen-lockfile
          pnpm build

          pm2 restart Apps_Motus
