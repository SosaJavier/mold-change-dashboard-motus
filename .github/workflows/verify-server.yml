name: Deploy Mold Change Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Stop PM2 (prevent file lock)
        run: pm2 stop Apps_Motus
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Restart or Start PM2 app
        run: |
          pm2 describe Apps_Motus
          if ($LASTEXITCODE -eq 0) {
            pm2 restart Apps_Motus
          } else {
            pm2 start npm --name "Apps_Motus" -- start
          }
